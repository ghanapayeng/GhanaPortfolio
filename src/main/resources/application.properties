# ==============================================================================
# GHANA KANTA PAYENG PORTFOLIO - SPRING BOOT CONFIGURATION
# Spring Boot 3 + Spring Data JPA (MySQL / TiDB) + Direct Mail Forwarder
# ==============================================================================

spring.application.name=portfolio-backend
server.port=${PORT:10000}

# ------------------------------------------------------------------------------
# DATASOURCE CONFIGURATION (Supports Local MySQL & Cloud TiDB)
# ------------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ghana_portfolio}?useSSL=${DB_SSL:true}&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:8453090249}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ------------------------------------------------------------------------------
# JPA & HIBERNATE CONFIGURATION
# ------------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ------------------------------------------------------------------------------
# DIRECT EMAIL NOTIFICATION CONFIGURATION
# ------------------------------------------------------------------------------
portfolio.contact.notification-email=${NOTIFICATION_EMAIL:ghanakanta076@gmail.com}

# SMTP Server Settings (Google Gmail SMTP)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:ghanakanta076@gmail.com}
spring.mail.password=${MAIL_PASSWORD:ggsbbyozfbrfspgo}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ------------------------------------------------------------------------------
# STATIC RESOURCE SERVING CONFIGURATION
# ------------------------------------------------------------------------------
spring.web.resources.static-locations=classpath:/static/

# ------------------------------------------------------------------------------
# LOGGING CONFIGURATION
# ------------------------------------------------------------------------------
logging.level.root=INFO
logging.level.com.ghanapayeng.portfolio=DEBUG

# ------------------------------------------------------------------------------
# ACTUATOR & HEALTH ENDPOINTS
# ------------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
